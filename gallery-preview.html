<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery Preview — Brooke Rogers</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── RUND (local) ──
           Trial cut: only A-Z a-z 0-9 space , - .
           Jost is stacked behind it so % & — ' ( ) / : still render. */
        @font-face { font-family: 'Rund Display'; src: url('fonts/RundDisplayTRIAL-Bold.otf') format('opentype');      font-weight: 700; font-display: swap; }
        @font-face { font-family: 'Rund Display'; src: url('fonts/RundDisplayTRIAL-ExtraBold.otf') format('opentype'); font-weight: 800; font-display: swap; }
        @font-face { font-family: 'Rund Display'; src: url('fonts/RundDisplayTRIAL-Black.otf') format('opentype');     font-weight: 900; font-display: swap; }

        @font-face { font-family: 'Rund Text'; src: url('fonts/RundTextTRIAL-Regular.otf') format('opentype');  font-weight: 400; font-display: swap; }
        @font-face { font-family: 'Rund Text'; src: url('fonts/RundTextTRIAL-Italic.otf') format('opentype');   font-weight: 400; font-style: italic; font-display: swap; }
        @font-face { font-family: 'Rund Text'; src: url('fonts/RundTextTRIAL-Medium.otf') format('opentype');   font-weight: 500; font-display: swap; }
        @font-face { font-family: 'Rund Text'; src: url('fonts/RundTextTRIAL-SemiBold.otf') format('opentype'); font-weight: 600; font-display: swap; }
        @font-face { font-family: 'Rund Text'; src: url('fonts/RundTextTRIAL-Bold.otf') format('opentype');     font-weight: 700; font-display: swap; }

* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --cream:#FFFFFF; --card:#FFFFFF; --red:#FF1B1C; --tangerine:#FF7F11;
  --dark:#262626; --white:#fff;
  --red-light:rgba(255,27,28,0.08); --red-border:rgba(255,27,28,0.20);
}
body { background:var(--cream); color:var(--dark);
  font-family:'Rund Text','Jost',sans-serif; font-weight:600; -webkit-font-smoothing:antialiased; }
img, video { max-width:100%; }
.section-label { font-size:10px; letter-spacing:5px; text-transform:uppercase;
  color:var(--dark); margin-bottom:16px; display:block; font-weight:700; }
.section-title { font-family:'Rund Display','Jost',sans-serif; font-size:42px;
  color:var(--red); margin-bottom:40px; font-weight:800; }
.note { max-width:1400px; margin:0 auto 8px; padding:24px 60px 0; font-size:12px;
  opacity:.55; font-weight:400; letter-spacing:.3px; }
/* ── GALLERY ── */
        .gallery-section {
            padding: 70px 60px;
        }

        .gallery-section .inner { max-width: 1400px; margin: 0 auto; }
        .gallery-section .section-label,
        .gallery-section .section-title { text-align: center; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-flow: dense;
            gap: 18px;
            margin-top: 44px;
        }

        /* fixed slot sizes — set per item in videos.js */
        .g-item              { grid-column: span 1; aspect-ratio: 4 / 5; }   /* default — all photos */
        .g-item.g-square     { grid-column: span 1; aspect-ratio: 1 / 1; }
        .g-item.g-wide       { grid-column: span 2; aspect-ratio: 8 / 5; }
        .g-item.g-big        { grid-column: span 2; aspect-ratio: 4 / 3; }
        .g-item.g-tall       { grid-column: span 1; aspect-ratio: 2 / 3; }
        .g-item.g-banner     { grid-column: span 4; aspect-ratio: 16 / 6; }

        .g-item {
            position: relative;
            overflow: hidden;
            background: var(--red-light);
        }

        .g-item img,
        .g-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .g-item:hover img,
        .g-item:hover video { transform: scale(1.04); }

        .g-caption {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 14px 16px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--white);
            background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .g-item:hover .g-caption { opacity: 1; }

        @media (max-width: 900px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
            .g-item.g-wide,
            .g-item.g-big,
            .g-item.g-banner { grid-column: span 2; }
            .g-item.g-banner { aspect-ratio: 16 / 9; }
        }

        @media (max-width: 640px) {
            .gallery-section { padding: 48px 22px; }
            .gallery-grid { gap: 12px; }
        }

        
</style>
</head>
<body>

<div class="note">Local preview of the Gallery tab — same CSS and renderer as index.html, reading the same videos.js.</div>

<section class="gallery-section">
  <div class="inner">
    <span class="section-label">Gallery</span>
    <div class="section-title">From My Camera Roll</div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>
</section>

<script src="videos.js"></script>
<script>
/* ── RENDER GALLERY FROM videos.js ── */
        function renderGallery(list) {
            var el = document.getElementById('gallery-grid');
            if (!el || !list) return;
            el.innerHTML = list.map(function (g) {
                var isVideo = /\.(mp4|webm|mov)$/i.test(g.src);
                var media = isVideo
                    ? '<video src="' + g.src + '" ' + (g.poster ? 'poster="' + g.poster + '" ' : '') +
                      'muted loop playsinline preload="none"></video>'
                    : '<img src="' + g.src + '" alt="' + (g.caption || '') + '" loading="lazy" />';
                var cap = g.caption ? '<div class="g-caption">' + g.caption + '</div>' : '';
                var size = g.size ? ' g-' + g.size : '';
                return '<div class="g-item' + size + '">' + media + cap + '</div>';
            }).join('');
        }

        if (typeof VIDEOS !== 'undefined' && VIDEOS.gallery) {
            renderGallery(VIDEOS.gallery);

            // only play clips that are actually on screen — keeps mobile smooth
            if ('IntersectionObserver' in window) {
                var io = new IntersectionObserver(function (entries) {
                    entries.forEach(function (e) {
                        var v = e.target;
                        if (e.isIntersecting) { v.play().catch(function () {}); }
                        else { v.pause(); }
                    });
                }, { rootMargin: '200px' });
                document.querySelectorAll('#gallery-grid video').forEach(function (v) { io.observe(v); });
            }
        }

</script>
</body>
</html>
